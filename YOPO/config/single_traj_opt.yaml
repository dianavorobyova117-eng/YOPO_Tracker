# YOPOv2-Tracker reproduction config.
# 2026-10-14 M2 reparam (docs/design/dual-task-proposal.md §3 参数重设清单, local branch m2-reparam):
#   band 0.5-2.5 m, low speed (vel 6->1.5), radio 5->1.5 (sgm_time auto 2.0 s, goal clip 3.0 m),
#   follow 4.5/6.8/0.75 -> 1.2/2.0/0.2; camera intrinsics stay sim values (real calib pending).

# IMPORTANT: follower velocity in testing (modifiable)
velocity: 1.5

# IMPORTANT: front target velocity/acceleration in testing.
# If omitted, target falls back to velocity/acc_max_train.
target_velocity: 1.0
target_acc_max: 1.0

# IMPORTANT: vel_max and acc_max in training
# not the actual values in testing, ensure consistency between testing and training, please refer to ../policy/primitive.py
vel_max_train: 1.5
acc_max_train: 1.5

# IMPORTANT: weight of costs for unit speed (can be visualized in tensorboard)
wg: 0.15   # guidance     (approaching the goal)
ws: 10.0   # smoothness   (smaller jerk)
wa: 1.0    # acceleration (smaller acceleration)
wc: 1.0    # collision    (distance to obstacle)

# dataset: set image_size = primitive_num × downsampling_factor (×32 for ResNet-18) in each axis
dataset_path: "../dataset"
image_height: 96
image_width: 160
camera_fx: 80.0
camera_fy: 80.0
camera_cx: 80.0
camera_cy: 48.0
camera_max_depth: 20.0
input_channels: 2       # depth + detector-style target bbox mask
observation_dim: 6      # velocity + acceleration
output_dim: 14          # primitive offset(3), end v/a(6), cost(1), objectness(1), target uv/depth(3)

# trajectory and primitive param (Note: traj_time = 2 * radio / vel_max) (can be visualized in rviz)
horizon_num: 5
vertical_num: 3
horizon_camera_fov: 90.0
vertical_camera_fov: 60.0
horizon_anchor_fov: 30.0
vertical_anchor_fov: 30.0
radio_range: 1.5    # planning horizon: 2 * radio_range; sgm_time = 2*radio/vel_max = 2.0 s
radio_num: 1        # only support 1 currently

# safety penalties
d0: 1.2
r: 0.6

# distribution for unit state sampling (can be visualized by 'python ./policy/yopo_dataset.py')
vx_mean_unit: 0.4
vy_mean_unit: 0.0
vz_mean_unit: 0.0
vx_std_unit: 2.0
vy_std_unit: 0.45
vz_std_unit: 0.3
ax_mean_unit: 0.0
ay_mean_unit: 0.0
az_mean_unit: 0.0
ax_std_unit: 0.5
ay_std_unit: 0.5
az_std_unit: 0.3
goal_pitch_std: 10.0  # clip goal_length to: 2 * radio_range; 10% probability [0, 2 * radio_range]
goal_yaw_std: 20.0

# extend the map to avoid trajectory exceeding bounds (especially in z-axis) and treating the sky outside the map as obstacle
map_expand_min: [0, 0, 0.2]
map_expand_max: [0, 0, 6.0]

# tracking head
target_position_scale: 20.0
target_radius: 0.35
target_mask_min_px: 3
target_mask_max_px: 48
target_mask_augment: true
target_mask_jitter_px: 4.0
target_mask_scale_jitter: 0.25
target_mask_dropout_prob: 0.05
target_mask_false_positive_prob: 0.15
target_mask_false_positive_max: 2
target_mask_false_positive_min_px: 3
target_mask_false_positive_max_px: 18
# 按龄折减增广(训练侧同折减,与 deploy/proto/defaults.py 折减常数对齐):
# mask 中心按 目标速度×采样龄 滞后;kill_prob=龄过 kill 点(0.7s)整框丢弃比例。
# 默认关;参数由链路实测拟合(热点轮死帧比 11.9%)后启用。
target_mask_lag_enable: false
target_mask_lag_prob: 0.5
target_mask_lag_age_min_s: 0.05
target_mask_lag_age_max_s: 0.7
target_mask_lag_kill_prob: 0.12
objectness_weight: 1.0
target_position_weight: 1.0
objectness_positive_weight: 5.0
objectness_negative_weight: 1.0
positive_grid_radius: 0
ignore_grid_radius: 1
objectness_threshold: 0.45
selection_objectness_bonus: 0.2
target_ema_alpha: 0.35
target_velocity_ema_alpha: 0.25

# inference follow/hold behavior
follow_distance: 1.2
follow_deadband: 0.2
follow_capture_distance: 2.0
follow_target_speed_threshold: 0.25
follow_max_step: 1.0
target_measurement_timeout: 0.4
target_hold_timeout: 4.0
use_mask_target_estimate: true
target_mask_timeout: 0.2
target_lost_timeout: 0.35
target_mask_min_pixels: 4
